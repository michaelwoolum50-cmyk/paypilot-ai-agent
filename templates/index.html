<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayPilot — AI Agentic Commerce</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>🤖 PayPilot</h1>
  <p class="tag">Your AI shopping agent. It finds the deal. PayPal pays.</p>
</header>
<main>
  <section class="card">
    <h2>Shop once</h2>
    <label>What do you want?
      <input id="query" placeholder="e.g. Sony WH-1000XM5 headphones" value="Sony WH-1000XM5 headphones">
    </label>
    <label>Max budget (USD)
      <input id="budget" type="number" min="1" step="0.01" value="300">
    </label>
    <label class="row"><input type="checkbox" id="dryrun" checked> Preview only (don't create a PayPal order)</label>
    <button id="go">Let the agent shop 🛒</button>
  </section>

  <section class="card">
    <h2>Autopilot price watch</h2>
    <label>Product <input id="wquery" placeholder="e.g. Kindle Paperwhite" value="Kindle Paperwhite"></label>
    <label>Buy under (USD) <input id="wtarget" type="number" min="1" step="0.01" value="110"></label>
    <label>Hard spending cap (USD) <input id="wcap" type="number" min="1" step="0.01" value="150"></label>
    <button id="wgo">Start watch 👀</button>
  </section>

  <section class="card wide">
    <h2>Agent reasoning trace</h2>
    <pre id="trace">The agent's thinking will appear here…</pre>
    <div id="result"></div>
  </section>
</main>
<footer>PayPilot · PayPal AI Hackathon 2026 · PayPal sandbox — no real money moves.</footer>
<script src="/static/app.js"></script>
</body>
</html>
